<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product — HTM Marketplace</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root { --navy:#12263a; --teal:#2a9d8f; --gold:#c9a84c; --warm-white:#f7f4f0; --charcoal:#2d2d2d; }
    * { box-sizing:border-box; margin:0; padding:0; }
    body { font-family:'Inter',sans-serif; background:var(--warm-white); color:var(--charcoal); min-height:100vh; }
    header { background:var(--navy); padding:0.9rem 1.1rem; display:flex; align-items:center; justify-content:space-between; position:sticky; top:0; z-index:100; }
    .back-btn { color:white; background:none; border:none; font-size:1rem; display:flex; align-items:center; gap:0.4rem; cursor:pointer; padding:0.3rem 0; }
    .back-btn svg { width:18px; height:18px; }
    .logo-text { color:white; font-size:1rem; font-weight:600; } .logo-text span { color:var(--gold); }
    .cart-btn { background:rgba(255,255,255,0.12); border:none; color:white; border-radius:20px; padding:0.4rem 0.85rem; font-size:0.85rem; font-weight:600; cursor:pointer; display:flex; align-items:center; gap:0.4rem; }
    .cart-count { background:var(--gold); color:var(--navy); border-radius:10px; padding:0.05rem 0.4rem; font-size:0.75rem; font-weight:700; }

    .product-hero { background:white; }
    .product-img { width:100%; aspect-ratio:4/3; object-fit:cover; background:#e8eff2; display:flex; align-items:center; justify-content:center; }
    .product-img img { width:100%; height:100%; object-fit:cover; }
    .product-img svg { width:64px; height:64px; color:#A9C2CC; }
    .sold-out-banner { background:#e74c3c; color:white; text-align:center; font-size:0.8rem; font-weight:700; padding:0.4rem; letter-spacing:0.05em; }

    .product-info { padding:1.2rem 1.1rem 1rem; }
    .product-category { font-size:0.75rem; font-weight:600; color:var(--teal); text-transform:uppercase; letter-spacing:0.08em; margin-bottom:0.35rem; }
    .product-name { font-size:1.4rem; font-weight:700; color:var(--navy); line-height:1.2; }
    .product-name-2 { font-size:1rem; color:#667; margin-top:0.2rem; }
    .product-price { font-size:1.5rem; font-weight:700; color:var(--navy); margin-top:0.75rem; }
    .product-price span { font-size:0.9rem; font-weight:400; color:#889; }
    .stock-tag { display:inline-block; font-size:0.75rem; font-weight:600; padding:0.2rem 0.6rem; border-radius:20px; margin-top:0.5rem; }
    .stock-ok { background:#d9f5ea; color:#0a6640; }
    .stock-zero { background:#fbe3e1; color:#8a241a; }

    .product-desc { padding:0 1.1rem 1rem; }
    .desc-label { font-size:0.75rem; font-weight:600; color:#889; text-transform:uppercase; letter-spacing:0.07em; margin-bottom:0.4rem; }
    .desc-text { font-size:0.95rem; color:#445; line-height:1.6; }

    .add-section { background:white; padding:1.1rem; margin-top:0.5rem; }
    .qty-row { display:flex; align-items:center; justify-content:space-between; margin-bottom:1rem; }
    .qty-label { font-size:0.85rem; font-weight:600; color:#556; }
    .qty-ctrl { display:flex; align-items:center; gap:0.75rem; }
    .step-btn { width:36px; height:36px; border-radius:50%; border:1.5px solid #dde2e8; background:white; font-size:1.1rem; cursor:pointer; display:flex; align-items:center; justify-content:center; color:var(--navy); }
    .step-btn:active { background:#f0f4f8; }
    .qty-val { font-size:1.1rem; font-weight:700; color:var(--navy); min-width:2.5rem; text-align:center; }
    .add-btn { width:100%; padding:0.9rem; background:var(--navy); color:white; border:none; border-radius:12px; font-size:1rem; font-weight:700; cursor:pointer; }
    .add-btn:disabled { background:#b0bec5; cursor:not-allowed; }
    .add-btn.added { background:var(--teal); }

    .also-like { padding:1.2rem 1.1rem 2rem; }
    .section-title { font-size:1rem; font-weight:700; color:var(--navy); margin-bottom:0.9rem; }
    .also-grid { display:grid; grid-template-columns:1fr 1fr; gap:0.75rem; }
    .mini-card { background:white; border-radius:12px; overflow:hidden; cursor:pointer; }
    .mini-img { width:100%; aspect-ratio:4/3; object-fit:cover; background:#e8eff2; display:flex; align-items:center; justify-content:center; }
    .mini-img img { width:100%; height:100%; object-fit:cover; }
    .mini-img svg { width:28px; height:28px; color:#A9C2CC; }
    .mini-info { padding:0.6rem 0.7rem 0.8rem; }
    .mini-name { font-size:0.82rem; font-weight:600; color:var(--navy); }
    .mini-name-2 { font-size:0.75rem; color:#889; }
    .mini-price { font-size:0.9rem; font-weight:700; color:var(--navy); margin-top:0.25rem; }

    .cart-bar { position:fixed; bottom:0; left:0; right:0; background:var(--navy); padding:0.8rem 1.1rem; display:none; align-items:center; justify-content:space-between; }
    .cart-bar.show { display:flex; }
    .cart-bar-text { color:white; font-size:0.85rem; }
    .cart-bar-text strong { display:block; font-size:1rem; }
    .checkout-bar-btn { background:var(--gold); color:var(--navy); border:none; border-radius:10px; padding:0.6rem 1.2rem; font-weight:700; font-size:0.9rem; cursor:pointer; }
  </style>
</head>
<body>

<header>
  <button class="back-btn" onclick="history.back()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back
  </button>
  <span class="logo-text">HTM <span>Marketplace</span></span>
  <button class="cart-btn" onclick="goToCart()">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    Cart <span class="cart-count" id="cart-count">0</span>
  </button>
</header>

<div id="product-hero" class="product-hero">
  <div class="product-img" id="product-img">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>
  </div>
  <div class="product-info">
    <div class="product-category" id="product-category"></div>
    <div class="product-name" id="product-name">Loading…</div>
    <div class="product-name-2" id="product-name-2"></div>
    <div class="product-price" id="product-price"></div>
    <span class="stock-tag" id="stock-tag"></span>
  </div>
  <div class="product-desc" id="product-desc" style="display:none">
    <div class="desc-label">About this product</div>
    <div class="desc-text" id="desc-text"></div>
  </div>
</div>

<div class="add-section" id="add-section">
  <div class="qty-row">
    <span class="qty-label" id="qty-label">Quantity (kg)</span>
    <div class="qty-ctrl">
      <button class="step-btn" id="btn-minus" onclick="changeQty(-1)">−</button>
      <span class="qty-val" id="qty-val">0.5</span>
      <button class="step-btn" onclick="changeQty(1)">+</button>
    </div>
  </div>
  <button class="add-btn" id="add-btn" onclick="addToCart()">Add to Cart</button>
</div>

<div class="also-like" id="also-like" style="display:none">
  <div class="section-title">You may also like</div>
  <div class="also-grid" id="also-grid"></div>
</div>

<div class="cart-bar" id="cart-bar">
  <div class="cart-bar-text">
    <span id="cart-bar-items"></span>
    <strong id="cart-bar-total"></strong>
  </div>
  <button class="checkout-bar-btn" onclick="goToCart()">View Cart →</button>
</div>

<script>
  const API = 'https://api.htmrentals.com/api/marketplace';
  const ICON_FISH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></svg>`;

  let product = null;
  let qty = 0.5;
  let cart = JSON.parse(localStorage.getItem('htm_cart') || '[]');

  const params = new URLSearchParams(location.search);
  const productId = parseInt(params.get('id'));

  function updateCartUI() {
    const total = cart.reduce((s, i) => s + (i.qty * i.price_per_kg), 0);
    const count = cart.reduce((s, i) => s + 1, 0);
    document.getElementById('cart-count').textContent = count;
    if (count > 0) {
      document.getElementById('cart-bar').classList.add('show');
      document.getElementById('cart-bar-items').textContent = count + (count === 1 ? ' item' : ' items');
      document.getElementById('cart-bar-total').textContent = 'MVR ' + total.toFixed(2);
    } else {
      document.getElementById('cart-bar').classList.remove('show');
    }
  }

  function goToCart() { window.location.href = 'checkout.html'; }

  function changeQty(delta) {
    if (!product) return;
    const step = product.unit_type === 'piece' ? 1 : 0.5;
    const min = step;
    qty = Math.max(min, parseFloat((qty + delta * step).toFixed(1)));
    document.getElementById('qty-val').textContent = qty + (product.unit_type === 'kg' ? ' kg' : '');
  }

  function addToCart() {
    if (!product || !product.in_stock) return;
    const existing = cart.find(i => i.id === product.id);
    if (existing) { existing.qty = parseFloat((existing.qty + qty).toFixed(1)); }
    else {
      cart.push({ id: product.id, name: product.name, name_secondary: product.name_secondary,
        qty, price_per_kg: parseFloat(product.price_per_kg), unit_type: product.unit_type, unit_label: product.unit_label });
    }
    localStorage.setItem('htm_cart', JSON.stringify(cart));
    updateCartUI();
    const btn = document.getElementById('add-btn');
    btn.textContent = 'Added!';
    btn.classList.add('added');
    setTimeout(() => { btn.textContent = 'Add to Cart'; btn.classList.remove('added'); }, 1200);
  }

  function renderAlsoLike(all) {
    const others = all.filter(p => p.id !== productId && p.active !== 0).slice(0, 4);
    if (!others.length) return;
    document.getElementById('also-like').style.display = '';
    document.getElementById('also-grid').innerHTML = others.map(p => `
      <div class="mini-card" onclick="location.href='product.html?id=${p.id}'">
        <div class="mini-img">${p.image_url ? `<img src="${p.image_url}" alt="${p.name}" loading="lazy">` : ICON_FISH}</div>
        <div class="mini-info">
          <div class="mini-name">${p.name_secondary || p.name}</div>
          ${p.name_secondary ? `<div class="mini-name-2">${p.name}</div>` : ''}
          <div class="mini-price">MVR ${parseFloat(p.price_per_kg).toFixed(2)} / ${p.unit_label || 'kg'}</div>
        </div>
      </div>`).join('');
  }

  async function load() {
    if (!productId) { location.href = 'index.html'; return; }
    try {
      const [res, allRes] = await Promise.all([
        fetch(`${API}/products/${productId}`),
        fetch(`${API}/products`)
      ]);
      product = await res.json();
      const all = await allRes.json();

      document.title = (product.name_secondary || product.name) + ' — HTM Marketplace';
      document.getElementById('product-category').textContent = product.category_name || '';
      document.getElementById('product-name').textContent = product.name;
      if (product.name_secondary) document.getElementById('product-name-2').textContent = product.name_secondary;
      document.getElementById('product-price').innerHTML = `MVR ${parseFloat(product.price_per_kg).toFixed(2)} <span>/ ${product.unit_label || 'kg'}</span>`;

      const stockTag = document.getElementById('stock-tag');
      if (product.in_stock) { stockTag.textContent = 'In Stock'; stockTag.className = 'stock-tag stock-ok'; }
      else { stockTag.textContent = 'Out of Stock'; stockTag.className = 'stock-tag stock-zero'; }

      if (product.image_url) {
        document.getElementById('product-img').innerHTML = `<img src="${product.image_url}" alt="${product.name}">`;
      }
      if (!product.in_stock) {
        document.getElementById('product-hero').insertAdjacentHTML('afterbegin', '<div class="sold-out-banner">OUT OF STOCK</div>');
        document.getElementById('add-btn').disabled = true;
        document.getElementById('add-btn').textContent = 'Out of Stock';
      }
      if (product.description) {
        document.getElementById('desc-text').textContent = product.description;
        document.getElementById('product-desc').style.display = '';
      }
      document.getElementById('qty-label').textContent = `Quantity (${product.unit_label || 'kg'})`;
      if (product.unit_type === 'piece') { qty = 1; document.getElementById('qty-val').textContent = '1'; }

      renderAlsoLike(all.filter(p => p.category_id === product.category_id));
      updateCartUI();
    } catch(err) {
      console.error(err);
      document.getElementById('product-name').textContent = 'Product not found';
    }
  }

  load();
</script>
</body>
</html>
