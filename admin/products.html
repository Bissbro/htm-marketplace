<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Products | HTM Marketplace</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0A2540; --gold: #B8975A; --teal: #40B5AD;
      --warm-white: #FAFAF8; --charcoal: #1C1C1E; --light: #F0F0EF; --mid: #8E8E93;
    }
    body { font-family: 'Inter', sans-serif; background: var(--warm-white); color: var(--charcoal); }

    .auth-gate {
      position: fixed; inset: 0; background: var(--navy);
      display: flex; align-items: center; justify-content: center; z-index: 999;
    }
    .auth-box { background: white; border-radius: 16px; padding: 2rem; width: 100%; max-width: 320px; text-align: center; }
    .auth-logo { font-family: 'Playfair Display', serif; font-size: 1.2rem; color: var(--navy); margin-bottom: 0.4rem; }
    .auth-logo span { color: var(--gold); }
    .auth-sub { font-size: 0.8rem; color: var(--mid); margin-bottom: 1.5rem; }
    .auth-input { width: 100%; border: 1.5px solid var(--light); border-radius: 8px; padding: 0.7rem; font-size: 0.9rem; margin-bottom: 0.75rem; font-family: 'Inter', sans-serif; text-align: center; letter-spacing: 0.1em; }
    .auth-input:focus { outline: none; border-color: var(--navy); }
    .auth-btn { width: 100%; background: var(--navy); color: white; border: none; border-radius: 8px; padding: 0.75rem; font-family: 'Inter', sans-serif; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
    .auth-error { color: #D94F4F; font-size: 0.78rem; margin-top: 0.5rem; }

    header { background: var(--navy); padding: 0 1.25rem; height: 60px; display: flex; align-items: center; justify-content: space-between; }
    .logo-text { color: white; font-family: 'Playfair Display', serif; font-size: 0.95rem; }
    .logo-text span { color: var(--gold); }
    .logout-btn { background: none; border: 1px solid rgba(255,255,255,0.3); color: rgba(255,255,255,0.7); font-size: 0.75rem; padding: 0.3rem 0.7rem; border-radius: 6px; cursor: pointer; font-family: 'Inter', sans-serif; }

    .admin-nav { background: white; border-bottom: 1px solid var(--light); display: flex; overflow-x: auto; }
    .nav-link { padding: 0.75rem 1.25rem; font-size: 0.82rem; font-weight: 600; color: var(--mid); text-decoration: none; white-space: nowrap; border-bottom: 2px solid transparent; }
    .nav-link.active { color: var(--navy); border-bottom-color: var(--navy); }
    .nav-link:hover { color: var(--navy); }

    .page { padding: 1.25rem; max-width: 700px; margin: 0 auto; }
    .page-title { font-family: 'Playfair Display', serif; font-size: 1.1rem; color: var(--navy); margin-bottom: 1.25rem; }

    /* ADD FORM */
    .add-form {
      background: white; border-radius: 12px; padding: 1.25rem;
      margin-bottom: 1.5rem; border: 1px solid rgba(10,37,64,0.06);
      box-shadow: 0 1px 4px rgba(10,37,64,0.06);
    }
    .form-title { font-weight: 600; font-size: 0.9rem; color: var(--navy); margin-bottom: 1rem; padding-bottom: 0.75rem; border-bottom: 1px solid var(--light); }
    .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media(max-width: 480px) { .form-row { grid-template-columns: 1fr; } }
    .form-group { margin-bottom: 0.85rem; }
    label { display: block; font-size: 0.73rem; font-weight: 600; color: var(--navy); margin-bottom: 0.35rem; text-transform: uppercase; letter-spacing: 0.04em; }
    input, textarea {
      width: 100%; border: 1.5px solid var(--light); border-radius: 8px;
      padding: 0.6rem 0.8rem; font-family: 'Inter', sans-serif; font-size: 0.88rem;
      color: var(--charcoal); background: var(--warm-white);
    }
    input:focus, textarea:focus { outline: none; border-color: var(--navy); background: white; }
    textarea { resize: vertical; min-height: 60px; }
    .submit-btn {
      background: var(--navy); color: white; border: none; border-radius: 8px;
      padding: 0.65rem 1.5rem; font-family: 'Inter', sans-serif; font-size: 0.85rem;
      font-weight: 600; cursor: pointer; transition: opacity 0.2s;
    }
    .submit-btn:hover { opacity: 0.85; }
    .success-msg { color: var(--teal); font-size: 0.8rem; margin-top: 0.5rem; font-weight: 600; }
    .error-msg { color: #D94F4F; font-size: 0.8rem; margin-top: 0.5rem; }

    /* PRODUCTS LIST */
    .product-card {
      background: white; border-radius: 12px; padding: 1rem;
      margin-bottom: 0.75rem; display: flex; align-items: center; gap: 0.85rem;
      border: 1px solid rgba(10,37,64,0.06); box-shadow: 0 1px 4px rgba(10,37,64,0.06);
    }
    .product-img-thumb {
      width: 52px; height: 52px; border-radius: 8px;
      background: linear-gradient(135deg, #e8f4f8, #d0eaf0);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.5rem; flex-shrink: 0; overflow: hidden;
    }
    .product-img-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .product-info { flex: 1; min-width: 0; }
    .product-name { font-weight: 600; font-size: 0.9rem; color: var(--navy); }
    .product-price { font-size: 0.8rem; color: var(--mid); margin-top: 0.15rem; }
    .product-desc-text { font-size: 0.75rem; color: var(--mid); margin-top: 0.1rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .product-actions { display: flex; flex-direction: column; gap: 0.4rem; flex-shrink: 0; }
    .action-btn {
      padding: 0.3rem 0.7rem; border-radius: 6px; font-family: 'Inter', sans-serif;
      font-size: 0.72rem; font-weight: 600; cursor: pointer; border: 1.5px solid var(--light);
      background: white; color: var(--charcoal); transition: all 0.15s;
    }
    .action-btn.edit-btn:hover { border-color: var(--navy); color: var(--navy); }
    .action-btn.toggle-on { background: #d1f7e8; color: #0a6640; border-color: #b8e8cc; }
    .action-btn.toggle-off { background: #fde8e8; color: #8a1a1a; border-color: #f8c8c8; }
    .available-dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; margin-right: 0.3rem; }
    .dot-on { background: #1a8a4a; }
    .dot-off { background: #D94F4F; }

    /* EDIT MODAL */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(10,37,64,0.5);
      display: none; align-items: flex-end; justify-content: center; z-index: 200;
    }
    .modal-overlay.open { display: flex; }
    .modal {
      background: white; border-radius: 16px 16px 0 0; padding: 1.5rem 1.25rem 2rem;
      width: 100%; max-width: 600px; max-height: 90vh; overflow-y: auto;
    }
    .modal-title { font-weight: 700; font-size: 1rem; color: var(--navy); margin-bottom: 1.25rem; }
    .modal-btns { display: flex; gap: 0.75rem; margin-top: 1rem; }
    .cancel-btn {
      flex: 1; background: var(--light); color: var(--charcoal); border: none;
      border-radius: 8px; padding: 0.65rem; font-family: 'Inter', sans-serif;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    .save-btn {
      flex: 2; background: var(--navy); color: white; border: none;
      border-radius: 8px; padding: 0.65rem; font-family: 'Inter', sans-serif;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }

    .empty-state { text-align: center; padding: 2.5rem 1rem; color: var(--mid); font-size: 0.9rem; }
  </style>
</head>
<body>

<div class="auth-gate" id="auth-gate">
  <div class="auth-box">
    <div class="auth-logo">HTM <span>Marketplace</span></div>
    <div class="auth-sub">Admin Access</div>
    <input class="auth-input" type="password" id="admin-pass" placeholder="Password" onkeydown="if(event.key==='Enter')login()">
    <button class="auth-btn" onclick="login()">Enter</button>
    <div class="auth-error" id="auth-error"></div>
  </div>
</div>

<div id="main-content" style="display:none">
  <header>
    <span class="logo-text">HTM <span>Marketplace</span> Admin</span>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </header>
  <nav class="admin-nav">
    <a href="index.html" class="nav-link">📋 Orders</a>
    <a href="products.html" class="nav-link active">🐟 Products</a>
    <a href="zones.html" class="nav-link">📍 Zones</a>
    <a href="../index.html" class="nav-link">🛒 Shop</a>
  </nav>

  <div class="page">
    <div class="page-title">Products</div>

    <!-- ADD FORM -->
    <div class="add-form">
      <div class="form-title">➕ Add New Fish</div>
      <div class="form-group">
        <label>Fish Name</label>
        <input type="text" id="new-name" placeholder="e.g. Yellowfin Tuna">
      </div>
      <div class="form-row">
        <div class="form-group" style="margin-bottom:0">
          <label>Price per KG (MVR)</label>
          <input type="number" id="new-price" placeholder="0.00" min="0" step="0.5">
        </div>
        <div class="form-group" style="margin-bottom:0">
          <label>Image URL <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
          <input type="text" id="new-image" placeholder="https://...">
        </div>
      </div>
      <div class="form-group" style="margin-top:0.85rem">
        <label>Description <span style="font-weight:400;text-transform:none;letter-spacing:0">(optional)</span></label>
        <textarea id="new-desc" placeholder="e.g. Gutted, cleaned and vacuum-packed fresh tuna"></textarea>
      </div>
      <button class="submit-btn" onclick="addProduct()">Add Product</button>
      <div class="success-msg" id="add-success"></div>
      <div class="error-msg" id="add-error"></div>
    </div>

    <!-- PRODUCTS LIST -->
    <div id="products-list"><div class="empty-state">Loading products...</div></div>
  </div>
</div>

<!-- EDIT MODAL -->
<div class="modal-overlay" id="edit-modal">
  <div class="modal">
    <div class="modal-title">Edit Product</div>
    <input type="hidden" id="edit-id">
    <div class="form-group">
      <label>Fish Name</label>
      <input type="text" id="edit-name">
    </div>
    <div class="form-row">
      <div class="form-group">
        <label>Price per KG (MVR)</label>
        <input type="number" id="edit-price" min="0" step="0.5">
      </div>
      <div class="form-group">
        <label>Image URL</label>
        <input type="text" id="edit-image">
      </div>
    </div>
    <div class="form-group">
      <label>Description</label>
      <textarea id="edit-desc"></textarea>
    </div>
    <div class="modal-btns">
      <button class="cancel-btn" onclick="closeModal()">Cancel</button>
      <button class="save-btn" onclick="saveEdit()">Save Changes</button>
    </div>
    <div class="error-msg" id="edit-error"></div>
  </div>
</div>

<script>
  const API = 'https://api.htmrentals.com/api/marketplace';
  const ADMIN_PASS = 'HTMAdmin2026';
  let products = [];

  function login() {
    const pass = document.getElementById('admin-pass').value;
    if (pass === ADMIN_PASS) {
      sessionStorage.setItem('mkt_admin', 'true');
      document.getElementById('auth-gate').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      loadProducts();
    } else {
      document.getElementById('auth-error').textContent = 'Incorrect password';
    }
  }
  function logout() { sessionStorage.removeItem('mkt_admin'); location.reload(); }
  function checkAuth() {
    if (sessionStorage.getItem('mkt_admin') === 'true') {
      document.getElementById('auth-gate').style.display = 'none';
      document.getElementById('main-content').style.display = 'block';
      loadProducts();
    }
  }

  async function loadProducts() {
    try {
      const res = await fetch(`${API}/admin/orders`);
      // Use products endpoint
      const pres = await fetch(`${API}/products`);
      products = await pres.json();
      // Also fetch unavailable ones via a workaround — fetch all through a combined call
      renderProducts();
    } catch(e) {
      document.getElementById('products-list').innerHTML = '<div class="empty-state">Failed to load products.</div>';
    }
  }

  async function addProduct() {
    const name = document.getElementById('new-name').value.trim();
    const price = document.getElementById('new-price').value;
    const image_url = document.getElementById('new-image').value.trim();
    const description = document.getElementById('new-desc').value.trim();
    document.getElementById('add-success').textContent = '';
    document.getElementById('add-error').textContent = '';
    if (!name || !price) { document.getElementById('add-error').textContent = 'Name and price are required.'; return; }
    try {
      const res = await fetch(`${API}/admin/products`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, price_per_kg: parseFloat(price), image_url: image_url || null, description: description || null })
      });
      const data = await res.json();
      if (data.success) {
        document.getElementById('add-success').textContent = '✓ Product added!';
        document.getElementById('new-name').value = '';
        document.getElementById('new-price').value = '';
        document.getElementById('new-image').value = '';
        document.getElementById('new-desc').value = '';
        setTimeout(() => { document.getElementById('add-success').textContent = ''; }, 3000);
        loadProducts();
      }
    } catch(e) {
      document.getElementById('add-error').textContent = 'Failed to add product.';
    }
  }

  async function toggleAvailable(id, currentVal) {
    await fetch(`${API}/admin/products/${id}`, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        name: products.find(p=>p.id===id).name,
        description: products.find(p=>p.id===id).description,
        price_per_kg: products.find(p=>p.id===id).price_per_kg,
        image_url: products.find(p=>p.id===id).image_url,
        is_available: currentVal ? 0 : 1
      })
    });
    loadProducts();
  }

  function openEdit(p) {
    document.getElementById('edit-id').value = p.id;
    document.getElementById('edit-name').value = p.name;
    document.getElementById('edit-price').value = p.price_per_kg;
    document.getElementById('edit-image').value = p.image_url || '';
    document.getElementById('edit-desc').value = p.description || '';
    document.getElementById('edit-error').textContent = '';
    document.getElementById('edit-modal').classList.add('open');
  }
  function closeModal() { document.getElementById('edit-modal').classList.remove('open'); }

  async function saveEdit() {
    const id = document.getElementById('edit-id').value;
    const p = products.find(pr => pr.id == id);
    const name = document.getElementById('edit-name').value.trim();
    const price = document.getElementById('edit-price').value;
    if (!name || !price) { document.getElementById('edit-error').textContent = 'Name and price required.'; return; }
    try {
      await fetch(`${API}/admin/products/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          name,
          price_per_kg: parseFloat(price),
          image_url: document.getElementById('edit-image').value.trim() || null,
          description: document.getElementById('edit-desc').value.trim() || null,
          is_available: p ? p.is_available : 1
        })
      });
      closeModal();
      loadProducts();
    } catch(e) {
      document.getElementById('edit-error').textContent = 'Failed to save.';
    }
  }

  function renderProducts() {
    const list = document.getElementById('products-list');
    if (!products.length) {
      list.innerHTML = '<div class="empty-state">No products yet. Add your first fish above!</div>';
      return;
    }
    list.innerHTML = products.map(p => {
      const img = p.image_url
        ? `<img src="${p.image_url}" alt="${p.name}">`
        : '🐟';
      return `
      <div class="product-card">
        <div class="product-img-thumb">${img}</div>
        <div class="product-info">
          <div class="product-name">${p.name}</div>
          <div class="product-price">MVR ${parseFloat(p.price_per_kg).toFixed(2)} / kg</div>
          ${p.description ? `<div class="product-desc-text">${p.description}</div>` : ''}
        </div>
        <div class="product-actions">
          <button class="action-btn edit-btn" onclick='openEdit(${JSON.stringify(p)})'>✏️ Edit</button>
          <button class="action-btn ${p.is_available ? 'toggle-on' : 'toggle-off'}" onclick="toggleAvailable(${p.id}, ${p.is_available})">
            <span class="available-dot ${p.is_available ? 'dot-on' : 'dot-off'}"></span>${p.is_available ? 'Available' : 'Hidden'}
          </button>
        </div>
      </div>`;
    }).join('');
  }

  checkAuth();
</script>
</body>
</html>
