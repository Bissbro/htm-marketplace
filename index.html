<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HTM Marketplace — Fresh Fish & Maldivian Products, Delivered</title>
  <meta name="description" content="Fresh fish, seafood, asaara and local Maldivian favourites delivered to your door across Hulhumalé. Free delivery.">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --navy: #0A2540;
      --navy-2: #0D3460;
      --gold: #B8975A;
      --teal: #40B5AD;
      --warm-white: #FAFAF8;
      --charcoal: #1C1C1E;
      --light: #ECECEA;
      --mid: #8E8E93;
      --danger: #C0392B;
    }
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; background: var(--warm-white); color: var(--charcoal); min-height: 100vh; }
    button { font-family: 'Inter', sans-serif; }

    /* ─── HEADER ─── */
    header {
      background: var(--navy);
      padding: 0 1.1rem;
      height: 58px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 200;
    }
    .logo { display: flex; align-items: center; gap: 0.55rem; text-decoration: none; }
    .logo-mark {
      width: 30px; height: 30px; border-radius: 8px;
      background: var(--gold);
      display: flex; align-items: center; justify-content: center;
      color: var(--navy);
      font-family: 'Inter', sans-serif;
      font-weight: 700; font-size: 0.9rem;
    }
    .logo-text { color: white; font-family: 'Inter', sans-serif; font-size: 1rem; font-weight: 600; letter-spacing: 0.01em; }
    .logo-text span { color: var(--gold); }
    .cart-btn {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.22);
      border-radius: 9px;
      color: white;
      padding: 0.45rem 0.75rem;
      font-size: 0.82rem;
      font-weight: 500;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 0.45rem;
      transition: border-color 0.2s;
    }
    .cart-btn:hover { border-color: var(--gold); }
    .cart-btn svg { width: 16px; height: 16px; }
    .cart-count {
      background: var(--gold);
      color: var(--navy);
      border-radius: 10px;
      min-width: 19px;
      height: 19px;
      padding: 0 5px;
      font-size: 0.7rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ─── HERO ─── */
    .hero-location { font-size:0.8rem; font-weight:700; color:rgba(255,255,255,0.6); letter-spacing:0.1em; text-transform:uppercase; text-align:center; margin-bottom:0.2rem; }
    .hero-sub { font-size:0.75rem; color:rgba(255,255,255,0.45); text-align:center; letter-spacing:0.08em; text-transform:uppercase; margin-bottom:1rem; }
    .hero-illustration { display:flex; justify-content:center; margin-bottom:1rem; }
    .hero-illustration svg { width:160px; height:auto; }
    .hero-info-strip { display:flex; flex-wrap:wrap; gap:0.5rem; justify-content:center; margin-top:1.1rem; }
    .hero-point { display:flex; align-items:center; gap:0.4rem; background:rgba(255,255,255,0.1); border:1px solid rgba(255,255,255,0.15); border-radius:20px; padding:0.35rem 0.75rem; font-size:0.78rem; color:rgba(255,255,255,0.9); font-weight:500; }
    .hero-pill-dot { width:7px; height:7px; border-radius:50%; background:var(--teal); flex-shrink:0; }
    .hero {
      background: linear-gradient(150deg, var(--navy) 0%, var(--navy-2) 85%);
      padding: 1.9rem 1.1rem 2.1rem;
      text-align: left;
    }
    .hero-inner { max-width: 860px; margin: 0 auto; }
    .hero-eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 0.45rem;
      color: var(--gold);
      font-size: 0.68rem;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      margin-bottom: 0.8rem;
    }
    .hero-eyebrow::before {
      content: '';
      width: 22px; height: 1.5px;
      background: var(--gold);
    }
    .hero h1 {
      font-family: 'Inter', sans-serif;
      color: white;
      font-size: 1.65rem;
      line-height: 1.22;
      font-weight: 700;
      margin-bottom: 0.55rem;
      max-width: 520px;
    }
    .hero h1 em { color: var(--gold); font-style: normal; }
    .hero p {
      color: rgba(255,255,255,0.62);
      font-size: 0.85rem;
      line-height: 1.5;
      max-width: 440px;
      margin-bottom: 1.1rem;
    }
    .hero-point {
      display: flex; align-items: center; gap: 0.4rem;
      color: rgba(255,255,255,0.82);
      font-size: 0.74rem;
      font-weight: 500;
    }

    @media (min-width: 768px) {
      .hero h1 { font-size: 2.1rem; }
      .hero { padding: 2.6rem 1.5rem 2.8rem; }
    }

    /* ─── CATEGORY TABS ─── */
    .tabs-wrap {
      position: sticky;
      top: 58px;
      z-index: 150;
      background: var(--warm-white);
      border-bottom: 1px solid var(--light);
    }
    .tabs {
      display: flex;
      gap: 0.4rem;
      overflow-x: auto;
      padding: 0.7rem 1.1rem;
      max-width: 860px;
      margin: 0 auto;
      scrollbar-width: none;
    }
    .tabs::-webkit-scrollbar { display: none; }
    .tab {
      flex-shrink: 0;
      padding: 0.42rem 0.95rem;
      border-radius: 18px;
      border: 1.2px solid var(--light);
      background: white;
      font-size: 0.78rem;
      font-weight: 600;
      color: var(--mid);
      cursor: pointer;
      transition: all 0.15s;
      white-space: nowrap;
    }
    .tab:hover { border-color: var(--navy); color: var(--navy); }
    .tab.active { background: var(--navy); border-color: var(--navy); color: white; }

    /* ─── PRODUCTS ─── */
    .catalog { max-width: 860px; margin: 0 auto; padding: 1.2rem 1.1rem 7.5rem; }

    .cat-section { margin-bottom: 1.8rem; }
    .cat-header {
      display: flex;
      align-items: baseline;
      gap: 0.6rem;
      margin-bottom: 0.85rem;
    }
    .cat-title {
      font-family: 'Inter', sans-serif;
      font-size: 1.08rem;
      font-weight: 700;
      color: var(--navy);
    }
    .cat-count { font-size: 0.72rem; color: var(--mid); font-weight: 500; }

    .grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.7rem;
    }
    @media (min-width: 640px) { .grid { grid-template-columns: repeat(3, 1fr); } }
    @media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }

    .card {
      background: white;
      border-radius: 11px;
      overflow: hidden;
      border: 1px solid rgba(10,37,64,0.07);
      box-shadow: 0 1px 3px rgba(10,37,64,0.05);
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.2s;
    }
    .card:hover { box-shadow: 0 4px 14px rgba(10,37,64,0.09); }

    .card-img {
      height: 108px;
      background: linear-gradient(140deg, #EAF2F5, #DCE9EE);
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card-img img { width: 100%; height: 100%; object-fit: cover; }
    .card-img svg { width: 34px; height: 34px; color: #A9C2CC; }
    .stock-pill {
      position: absolute;
      top: 7px;
      left: 7px;
      font-size: 0.6rem;
      font-weight: 700;
      letter-spacing: 0.03em;
      padding: 0.18rem 0.5rem;
      border-radius: 5px;
      text-transform: uppercase;
    }
    .pill-in { background: rgba(255,255,255,0.92); color: #14784A; }
    .pill-out { background: rgba(28,28,30,0.78); color: white; }

    .card.sold-out .card-img img { filter: grayscale(0.85) opacity(0.75); }
    .card.sold-out { opacity: 0.88; }

    .card-body {
      padding: 0.7rem 0.75rem 0.8rem;
      display: flex;
      flex-direction: column;
      flex: 1;
    }
    .p-name {
      font-weight: 700;
      font-size: 0.86rem;
      color: var(--navy);
      line-height: 1.25;
    }
    .p-name-2 {
      font-size: 0.7rem;
      color: var(--mid);
      font-weight: 500;
      margin-top: 0.1rem;
      line-height: 1.3;
    }
    .p-price {
      margin-top: 0.5rem;
      margin-bottom: 0.65rem;
      font-family: 'Inter', sans-serif;
      font-size: 1.02rem;
      font-weight: 700;
      color: var(--navy);
    }
    .p-price span {
      font-family: 'Inter', sans-serif;
      font-size: 0.66rem;
      font-weight: 500;
      color: var(--mid);
      margin-left: 0.1rem;
    }

    .card-controls { margin-top: auto; }
    .stepper {
      display: flex;
      align-items: center;
      border: 1.2px solid var(--light);
      border-radius: 8px;
      overflow: hidden;
      margin-bottom: 0.45rem;
    }
    .step-btn {
      background: #F5F5F3;
      border: none;
      width: 32px;
      height: 30px;
      cursor: pointer;
      color: var(--navy);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s;
      flex-shrink: 0;
    }
    .step-btn:hover { background: #E8E8E6; }
    .step-btn svg { width: 11px; height: 11px; }
    .step-val {
      flex: 1;
      text-align: center;
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--navy);
      border: none;
      background: white;
      min-width: 0;
    }
    .step-val:focus { outline: none; }
    .step-unit {
      font-size: 0.62rem;
      color: var(--mid);
      font-weight: 600;
      padding-right: 0.5rem;
      flex-shrink: 0;
    }
    .add-btn {
      width: 100%;
      background: var(--navy);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.5rem;
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
    }
    .add-btn:hover { background: var(--navy-2); }
    .add-btn:active { transform: scale(0.97); }
    .add-btn.added { background: var(--teal); }
    .add-btn svg { width: 13px; height: 13px; }

    .soldout-note {
      width: 100%;
      text-align: center;
      padding: 0.5rem;
      border-radius: 8px;
      background: #F5F5F3;
      color: var(--mid);
      font-size: 0.74rem;
      font-weight: 600;
    }

    /* ─── STATES ─── */
    .state {
      text-align: center;
      padding: 3.2rem 1rem;
      color: var(--mid);
      font-size: 0.88rem;
      grid-column: 1 / -1;
    }
    .state svg { width: 38px; height: 38px; color: #C9D4DA; margin-bottom: 0.7rem; }

    /* ─── CART FOOTER ─── */
    .cart-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: var(--navy);
      padding: 0.8rem 1.1rem;
      display: none;
      align-items: center;
      justify-content: space-between;
      z-index: 300;
      box-shadow: 0 -4px 20px rgba(10,37,64,0.25);
    }
    .cart-footer.visible { display: flex; }
    .cf-count { font-size: 0.72rem; color: rgba(255,255,255,0.6); margin-bottom: 0.1rem; }
    .cf-total { font-family: 'Inter', sans-serif; font-size: 1.08rem; font-weight: 700; color: var(--gold); }
    .checkout-btn {
      background: var(--gold);
      color: var(--navy);
      border: none;
      border-radius: 9px;
      padding: 0.65rem 1.3rem;
      font-size: 0.85rem;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
      display: flex;
      align-items: center;
      gap: 0.45rem;
    }
    .checkout-btn:hover { opacity: 0.92; }
    .checkout-btn svg { width: 14px; height: 14px; }

    /* ─── FOOTER ─── */
    .site-footer {
      background: var(--navy);
      color: rgba(255,255,255,0.55);
      text-align: center;
      padding: 1.6rem 1.1rem 2rem;
      font-size: 0.74rem;
      line-height: 1.7;
    }
    .site-footer strong { color: rgba(255,255,255,0.85); font-family: 'Inter', sans-serif; font-size: 0.86rem; display: block; margin-bottom: 0.2rem; }
  </style>
</head>
<body>

<header>
  <a href="index.html" class="logo">
    <span class="logo-text">HTM <span>Marketplace</span></span>
  </a>
  <button class="cart-btn" onclick="goToCart()" aria-label="View cart">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
    Cart <span class="cart-count" id="cart-count">0</span>
  </button>
</header>

<section class="hero">
  <div class="hero-inner">
    <div class="hero-location">HULHUMALÉ</div>
    <div class="hero-sub">Groceries &amp; Fresh Produce</div>
    <div class="hero-illustration">
      <svg viewBox="0 0 280 130" fill="none" xmlns="http://www.w3.org/2000/svg">

    </div>
    <h1 style="text-align:center">The Taste of the Maldives, <em>Delivered to Your Door</em></h1>

</section>

<div class="tabs-wrap">
  <div class="tabs" id="tabs">
    <button class="tab active" data-cat="all">All</button>
  </div>
</div>

<div id="closed-banner" style="display:none; background:#FDF3D7; color:#7A5C04; font-size:0.8rem; font-weight:600; padding:0.7rem 1.1rem; text-align:center; line-height:1.45;"></div>

<main class="catalog" id="catalog">
  <div class="state" id="loading-state">Loading products…</div>
</main>

<div class="cart-footer" id="cart-footer">
  <div>
    <div class="cf-count" id="cf-count"></div>
    <div class="cf-total" id="cf-total"></div>
  </div>
  <button class="checkout-btn" onclick="goToCart()">
    Checkout
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
  </button>
</div>

<footer class="site-footer">
  <strong>HTM Marketplace</strong>
  Fresh fish &amp; Maldivian products, delivered across Hulhumalé.<br>
  Orders: +960 9373113
</footer>

<script>
  const API = 'https://api.htmrentals.com/api/marketplace';
  let cart = JSON.parse(localStorage.getItem('htm_cart') || '[]');
  let products = [];
  let categories = [];
  let activeCat = 'all';

  const ICON_FISH = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6.5 12c.94-3.46 4.94-6 8.5-6 3.56 0 6.06 2.54 7 6-.94 3.47-3.44 6-7 6s-7.56-2.53-8.5-6Z"/><path d="M18 12v.5"/><path d="M16 17.93a9.77 9.77 0 0 1 0-11.86"/><path d="M7 10.67C7 8 5.58 5.97 2.73 5.5c-1 1.5-1 5.5 0 7 2.85-.47 4.27-2.5 4.27-2.83Z"/></svg>`;

  function saveCart() {
    localStorage.setItem('htm_cart', JSON.stringify(cart));
    updateCartUI();
  }

  function updateCartUI() {
    const total = cart.reduce((s, i) => s + (i.qty * i.price_per_kg), 0);
    const count = cart.length;
    document.getElementById('cart-count').textContent = count;
    const footer = document.getElementById('cart-footer');
    if (count > 0) {
      footer.classList.add('visible');
      document.getElementById('cf-count').textContent = `${count} item${count>1?'s':''}`;
      document.getElementById('cf-total').textContent = `MVR ${total.toFixed(2)}`;
    } else {
      footer.classList.remove('visible');
    }
  }

  function goToCart() {
    if (cart.length === 0) return;
    window.location.href = 'checkout.html';
  }

  function stepOf(p) { return p.unit_type === 'kg' ? 0.5 : 1; }
  function minOf(p) { return p.unit_type === 'kg' ? 0.5 : 1; }
  function fmtQty(p, v) { return p.unit_type === 'kg' ? v.toFixed(1) : String(Math.round(v)); }

  function changeQty(pid, dir) {
    const p = products.find(x => x.id === pid);
    const input = document.getElementById(`q-${pid}`);
    const step = stepOf(p);
    const maxStock = Math.max(minOf(p), parseFloat(p.stock_balance));
    let v = parseFloat(input.value) || minOf(p);
    v += dir * step;
    if (v < minOf(p)) v = minOf(p);
    if (v > maxStock) v = maxStock;
    input.value = fmtQty(p, v);
  }

  function addToCart(pid) {
    const p = products.find(x => x.id === pid);
    const input = document.getElementById(`q-${pid}`);
    let qty = parseFloat(input.value) || minOf(p);
    const maxStock = Math.max(minOf(p), parseFloat(p.stock_balance));
    if (qty > maxStock) qty = maxStock;

    const existing = cart.find(i => i.id === p.id);
    if (existing) {
      existing.qty = Math.min(Math.round((existing.qty + qty) * 10) / 10, maxStock);
    } else {
      cart.push({
        id: p.id,
        name: p.name,
        name_secondary: p.name_secondary,
        qty,
        price_per_kg: parseFloat(p.price_per_kg),
        unit_type: p.unit_type,
        unit_label: p.unit_label
      });
    }
    saveCart();

    const btn = document.getElementById(`add-${pid}`);
    btn.classList.add('added');
    btn.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg> Added`;
    setTimeout(() => {
      btn.classList.remove('added');
      btn.innerHTML = addLabel();
    }, 1400);
  }

  function addLabel() {
    return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Add`;
  }

  function cardHTML(p) {
    const inStock = p.in_stock;
    const img = p.image_url ? `<img src="${p.image_url}" alt="${p.name}" loading="lazy">` : ICON_FISH;
    const pill = inStock
      ? `<span class="stock-pill pill-in">In Stock</span>`
      : `<span class="stock-pill pill-out">Sold Out</span>`;
    const sub = p.name_secondary ? `<div class="p-name-2">${p.name_secondary}</div>` : '';
    const controls = inStock ? `
      <div class="card-controls">
        <div class="stepper">
          <button class="step-btn" onclick="changeQty(${p.id}, -1)" aria-label="Decrease">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
          <input class="step-val" id="q-${p.id}" value="${fmtQty(p, minOf(p))}" inputmode="decimal">
          <span class="step-unit">${p.unit_label}</span>
          <button class="step-btn" onclick="changeQty(${p.id}, 1)" aria-label="Increase">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          </button>
        </div>
        <button class="add-btn" id="add-${p.id}" onclick="addToCart(${p.id})">${addLabel()}</button>
      </div>` : `
      <div class="card-controls">
        <div class="soldout-note">Back soon</div>
      </div>`;

    return `
    <div class="card ${inStock ? '' : 'sold-out'}">
      <a href="product.html?id=${p.id}" style="text-decoration:none;color:inherit;display:block">
        <div class="card-img">${img}${pill}</div>
        <div class="card-body">
          <div class="p-name">${p.name}</div>
          ${sub}
          <div class="p-price">MVR ${parseFloat(p.price_per_kg).toFixed(2)}<span>/ ${p.unit_label}</span></div>
        </div>
      </a>
      <div class="card-body" style="padding-top:0">${controls}</div>
    </div>`;
  }

  function render() {
    const catalog = document.getElementById('catalog');
    if (!products.length) {
      catalog.innerHTML = `<div class="state">${ICON_FISH}<div>No products available right now.<br>Check back soon.</div></div>`;
      return;
    }

    if (activeCat === 'all') {
      // Group by category, respecting category sort
      const groups = {};
      const order = [];
      products.forEach(p => {
        const key = p.category_name || 'Other';
        if (!groups[key]) { groups[key] = []; order.push(key); }
        groups[key].push(p);
      });
      catalog.innerHTML = order.map(cat => `
        <section class="cat-section">
          <div class="cat-header">
            <h2 class="cat-title">${cat}</h2>
            <span class="cat-count">${groups[cat].length} item${groups[cat].length>1?'s':''}</span>
          </div>
          <div class="grid">${groups[cat].map(cardHTML).join('')}</div>
        </section>`).join('');
    } else {
      const filtered = products.filter(p => String(p.category_id) === String(activeCat));
      const catName = (categories.find(c => String(c.id) === String(activeCat)) || {}).name || '';
      catalog.innerHTML = `
        <section class="cat-section">
          <div class="cat-header">
            <h2 class="cat-title">${catName}</h2>
            <span class="cat-count">${filtered.length} item${filtered.length!==1?'s':''}</span>
          </div>
          <div class="grid">
            ${filtered.length ? filtered.map(cardHTML).join('') : `<div class="state">Nothing here yet — check back soon.</div>`}
          </div>
        </section>`;
    }
  }

  function renderTabs() {
    const tabs = document.getElementById('tabs');
    tabs.innerHTML = `<button class="tab ${activeCat==='all'?'active':''}" data-cat="all">All</button>` +
      categories.map(c =>
        `<button class="tab ${String(activeCat)===String(c.id)?'active':''}" data-cat="${c.id}">${c.name}</button>`
      ).join('');
    tabs.querySelectorAll('.tab').forEach(btn => {
      btn.addEventListener('click', () => {
        activeCat = btn.dataset.cat;
        renderTabs();
        render();
        window.scrollTo({ top: document.querySelector('.tabs-wrap').offsetTop - 58, behavior: 'smooth' });
      });
    });
  }

  function fmtTime(t) {
    const [h, m] = t.split(':').map(Number);
    const ampm = h >= 12 ? 'PM' : 'AM';
    const h12 = h % 12 === 0 ? 12 : h % 12;
    return m === 0 ? `${h12} ${ampm}` : `${h12}:${String(m).padStart(2,'0')} ${ampm}`;
  }

  const CHECK = `<span class="hero-pill-dot"></span>`;

  function renderSettings(s) {
    const points = [];
    if (s.free_delivery_threshold > 0) points.push(`Free delivery above MVR ${s.free_delivery_threshold}`);
    points.push('Same-day delivery');
    points.push(`Open ${fmtTime(s.open_time)} – ${fmtTime(s.close_time)}`);
    document.getElementById('hero-points').innerHTML =
      points.map(p => `<div class="hero-point">${CHECK} ${p}</div>`).join('');

    const banner = document.getElementById('closed-banner');
    if (!s.shop_open) {
      if (s.closed_mode === 'block') {
        banner.textContent = `We're closed right now — orders open at ${fmtTime(s.open_time)}.`;
      } else {
        banner.textContent = `We're closed for today — orders placed now will be delivered tomorrow.`;
      }
      banner.style.display = 'block';
    }
  }

  async function load() {
    try {
      const [catRes, prodRes, setRes] = await Promise.all([
        fetch(`${API}/categories`),
        fetch(`${API}/products`),
        fetch(`${API}/settings`)
      ]);
      categories = await catRes.json();
      products = await prodRes.json();
      renderSettings(await setRes.json());
      renderTabs();
      render();
    } catch (err) {
      document.getElementById('catalog').innerHTML =
        `<div class="state">Could not load products. Please refresh the page.</div>`;
    }
  }

  updateCartUI();
  load();
</script>
</body>
</html>
